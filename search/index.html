<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizy Flash</title>
    <link rel="stylesheet" href="../theme/css/bootstrap.min.css?v=red6">
    <link rel="stylesheet" href="../theme/fontello/css/quizy-flash.css">
    <link rel="stylesheet" href="../theme/css/style.css?v=red6">
    <meta name="csrf-token" content="706Ayc4GoM5mkDEZ2IMpiaKcn0VMQSPdvbxBLjYD" />
    <link rel="shortcut icon" type="image/x-icon" href="../theme/images/favicon-quizpro.ico">
</head>
<body>
    <div class="content-wrapper">

        
    <div class="page-header">
        <div class="box-wrapper mx-auto text-center position-relative">
            <a href="../index.html" class="page-header-back"><span class="qf-icon-back"></span></a>
            Search Result
        </div>
    </div>

    
    <div class="container box-wrapper">
        <div class="text-white text-center mb-3">
            <p class="mb-1">Search result for:</p>
            <p class="mb-0 fw-bold" id="search-keyword">""</p>
        </div>
        <div class="card-simple-outer rounded">

            <ul class="quiz-list-wrapper" id="search-results">
                <!-- search results are rendered by the script at the bottom of this page -->
            </ul>
        </div>
    </div>
    
    
    </div>

    <!-- Login Model Start -->
    <div class="modal fade modal-standard" tabindex="-1" role="dialog" id="modalplay">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header" style="background: #E31C23;">
                    <img src="../theme/images/logo_quizypro.png" width="80" alt="Logo">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">Please login first to continue</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary shadow-sm" data-bs-dismiss="modal" aria-label="Close">Close</button>
                    <a href="../login/index.html" class="btn button-green shadow-sm">Login</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Login Model End -->

    <script src="../ext/code.jquery.com/jquery-3.6.1.min.js"></script>
    <script src="../theme/js/session.js?v=1"></script>
    <script src="../theme/js/i18n.js?v=1"></script>
    <script src="../theme/js/bootstrap.bundle.min.js"></script>

    <script src="../theme/js/custom.js?v=login2"></script>

    <script>
    // Static site: search the quiz list in the browser instead of on a server.
    (function() {
        var quizzes = [
            {url: "game/detail/1/index.html", img: "images/category/1/icon/1_01122022_icon_image.png", title: "Sports", desc: "Common sports terms, famous players, rules of games, and memorable moments at sports events."},
            {url: "game/detail/21/index.html", img: "images/category/21/icon/21_01122022_icon_image.png", title: "Movies & Music", desc: "Title of popular movies, cast, and memorable scene. Song title, singer, and composer."},
            {url: "game/detail/22/index.html", img: "images/category/22/icon/22_01122022_icon_image.png", title: "Social Media", desc: "Social media terms, social media history, founder history, and their achievement."},
            {url: "game/detail/25/index.html", img: "images/category/25/icon/25_01122022_icon_image.png", title: "Science", desc: "General knowledge of science, programming, physics, and chemical terms"},
            {url: "game/detail/26/index.html", img: "images/category/26/icon/26_01122022_icon_image.png", title: "Books", desc: "Title of popular books, novels, popular writers,"},
            {url: "game/detail/28/index.html", img: "images/category/28/icon/28_01122022_icon_image.png", title: "Vehicles", desc: "Vehicle name, engine, technology."},
            {url: "game/detail/29/index.html", img: "images/category/29/icon/29_01122022_icon_image.png", title: "Maths", desc: "Basic Calculation, Number line, Integers and Variables, Algebraic."},
            {url: "game/detail/30/index.html", img: "images/category/30/icon/30_01122022_icon_image.png", title: "General Knowledge", desc: "World History, popular news, a world phenomenon, general terms."},
            {url: "game/detail/31/index.html", img: "images/category/31/icon/31_01122022_icon_image.png", title: "World Map & Flags", desc: "Name of the country, the capital city, president/leader, geography, demography"},
            {url: "game/detail/32/index.html", img: "images/category/32/icon/32_01122022_icon_image.png", title: "Animal", desc: "Name of animal, type of animal, animal ability"},
            {url: "game/detail/33/index.html", img: "images/category/33/icon/33_01122022_icon_image.png", title: "Food", desc: "Name of food, taste, ingredients, food country origin"}
        ];

        function esc(s) {
            return $('<div>').text(s).html();
        }

        var keyword = (new URLSearchParams(window.location.search).get('q') || '').trim();
        $('#search-keyword').text('"' + keyword + '"');

        var q = keyword.toLowerCase();
        var results = quizzes.filter(function(quiz) {
            return (quiz.title + ' ' + quiz.desc).toLowerCase().indexOf(q) !== -1;
        });

        if (!q || !results.length) {
            $('#search-results').html('<div class="text-center text-white"><div class="alert alert-light">No result found, try another keyword</div></div>');
            return;
        }

        $('#search-results').html(results.map(function(quiz) {
            return '<li class="quiz-list">' +
                '<a href="../' + quiz.url + '" class="d-flex w-100">' +
                '<div class="quiz-list-pict"><img src="../' + quiz.img + '" alt="Quiz"></div>' +
                '<div class="quiz-list-info">' +
                '<h4 class="quiz-list-info-title">' + esc(quiz.title) + '</h4>' +
                '<p>' + esc(quiz.desc) + '</p>' +
                '</div></a></li>';
        }).join(''));
    })();
    </script>
</body>
</html>

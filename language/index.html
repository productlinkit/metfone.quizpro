<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizy Flash</title>
    <link rel="stylesheet" href="../theme/css/bootstrap.min.css?v=red6">
    <link rel="stylesheet" href="../theme/fontello/css/quizy-flash.css">
    <link rel="stylesheet" href="../theme/css/style.css?v=red6">
    <link rel="stylesheet" href="../theme/css/profile.css?v=red6">
    <link rel="stylesheet" href="../theme/css/pages.css?v=red6">
    <link rel="stylesheet" href="../theme/floating-copy/css/style.css">
    <link rel="stylesheet" href="../ext/cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="shortcut icon" type="image/x-icon" href="../theme/images/favicon-quizpro.ico">
</head>
<body>
    <div class="content-wrapper">

        
    <div class="content-wrapper">

        <div class="page-header">
            <div class="box-wrapper mx-auto text-center position-relative">
                <a href="../profile/index.html" class="page-header-back"><span class="qf-icon-back"></span></a>
                Languages
            </div>
        </div>

        <form class="form" id="langForm">
            <div class="container box-wrapper">
                <div class="lang-current" id="langCurrent"></div>
                <div class="card-simple-outer">
                    <p class="lang-title">Choose your language</p>
                    <div class="lang-list" id="langList" role="radiogroup"></div>
                </div>
                <input type="submit" class="btn btn-lg button-primary w-100" value="Save">
            </div>
        </form>

    </div>
    

    </div>

    <!-- Login Model Start -->
    <div class="modal fade modal-standard" tabindex="-1" role="dialog" id="modalplay">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header" style="background: #E31C23;">
                    <img src="../theme/images/logo_quizypro.png" width="80" alt="Logo">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">Please login first to continue</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary shadow-sm" data-bs-dismiss="modal" aria-label="Close">Close</button>
                    <a href="../login/index.html" class="btn button-green shadow-sm">Login</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Login Model End -->

    
    <script src="../ext/code.jquery.com/jquery-3.6.1.min.js"></script>
    <script src="../theme/js/session.js?v=1"></script>
    <script src="../theme/js/i18n.js?v=1"></script>
    <script src="../theme/js/bootstrap.bundle.min.js"></script>
    <script src="../theme/js/custom.js?v=login2"></script>
    <script>
    (function () {
        var I = window.QP_I18N, chosen = I.current().code;
        var list = document.getElementById('langList'), cur = document.getElementById('langCurrent');
        function flag(l) { return '<img class="lang-flag" src="' + I.flagUrl(l) + '" alt="">'; }
        function render() {
            var c = I.LANGS.filter(function (l) { return l.code === chosen; })[0];
            cur.innerHTML = flag(c) + '<div><div class="lang-current-label">Selected</div><div class="lang-current-name">' + c.native + '</div></div>';
            list.innerHTML = I.LANGS.map(function (l) {
                var on = l.code === chosen;
                return '<button type="button" class="lang-item' + (on ? ' active' : '') + '" role="radio" aria-checked="' + on + '" data-code="' + l.code + '">' +
                    flag(l) + '<span class="lang-name"><b>' + l.native + '</b><small>' + l.name + '</small></span>' +
                    '<span class="lang-check"></span></button>';
            }).join('');
        }
        list.addEventListener('click', function (e) {
            var b = e.target.closest('.lang-item'); if (!b) return;
            chosen = b.getAttribute('data-code'); render();
        });
        document.getElementById('langForm').addEventListener('submit', function (e) {
            e.preventDefault();
            I.setLang(chosen);
            location.href = 'profile.html';
        });
        render();
    })();
    </script>
</body>
</html>

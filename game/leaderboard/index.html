    <script>
    (function () {
        var S = window.QP_SESSION, C = window.QP_LEADERBOARD, t = QP_I18N.t;
        function esc(x) { return $('<div>').text(x).html(); }
        function ava(p) {
            if (p.me) return '<img src="' + S.avatar() + '" data-user-avatar alt="">';
            if (p.avatar) return '<img src="' + S.root + p.avatar + '" alt="">';
            return '<span class="opp-initial" style="background-color:' + p.color + '">' + esc(p.name.charAt(0)) + '</span>';
        }
        var u = S.user || {}, players = C.players.map(function (p) {
            return p.me ? Object.assign({}, p, { name: u.name || u.msisdn || t('You') }) : p;
        }).sort(function (a, b) { return b.score - a.score; });
        function row(p, i) {
            return '<li class="lb-row' + (p.me ? ' is-me' : '') + '"><span class="lb-rank">' + (i + 4) + '</span><span class="lb-ava">' + ava(p) + '</span>' +
                '<span class="lb-name">' + esc(p.name) + '</span><span class="lb-score">' + p.score.toLocaleString('en-US') + '</span></li>';
        }
        // Podium: 2nd, 1st, 3rd
        document.getElementById('lbPodium').innerHTML = [[1, 'silver'], [0, 'gold'], [2, 'bronze']].map(function (x) {
            var p = players[x[0]];
            return '<div class="lb-step ' + x[1] + (p.me ? ' is-me' : '') + '">' + (x[0] === 0 ? '<span class="lb-crown qf-icon-crown"></span>' : '') +
                '<span class="lb-step-ava">' + ava(p) + '<b>' + (x[0] + 1) + '</b></span><span class="lb-step-name">' + esc(p.name) + '</span>' +
                '<span class="lb-step-score">' + p.score.toLocaleString('en-US') + '</span><span class="lb-step-base"></span></div>';
        }).join('');
        document.getElementById('lbList').innerHTML = players.slice(3).map(row).join('');
        var medals = { 1: 'gold', 2: 'silver', 3: 'bronze' };
        document.getElementById('lbPrizes').innerHTML = C.prizes.map(function (x) {
            return '<div class="lb-prize ' + (medals[x.rank] || '') + '"><span class="lb-prize-ico"><span class="fa ' + x.icon + '"></span></span>' +
                '<span class="lb-prize-info"><small>' + t('Rank') + ' ' + x.rank + '</small><b>' + esc(t(x.name)) + '</b></span>' +
                '<span class="lb-prize-need">' + t('Score') + '<b>' + x.minScore.toLocaleString('en-US') + '+</b></span></div>';
        }).join('');
    })();
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizy Flash</title>
    <link rel="stylesheet" href="../../theme/css/bootstrap.min.css?v=red14">
    <link rel="stylesheet" href="../../theme/fontello/css/quizy-flash.css">
    <link rel="stylesheet" href="../../theme/css/style.css?v=red14">
    <link rel="stylesheet" href="../../ext/cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="../../theme/css/game.css?v=red14">
    <link rel="shortcut icon" type="image/x-icon" href="../../theme/images/favicon-quizpro.ico">
</head>
<body>
    <div class="content-wrapper">

        <div class="page-header-score game-header">
            <div class="container box-wrapper">
                <div class="game-hud">
                    <div class="game-player me">
                        <div class="game-ava" id="gp-me">
                            <img src="../../theme/images/dp.png" data-user-avatar alt="You">
                        </div>
                        <div class="game-info">
                            <div class="game-name">You</div>
                            <div class="game-score" id="gp-real">
                                <span id="real_score_start">0</span><span id="real_score_show"></span>
                            </div>
                        </div>
                        <span class="game-gain" id="gp-gain"></span>
                    </div>
                    <div class="countdown" id="countdown">
                        <span id="countdown-number">20</span>
                        <svg>
                            <circle r="18" cx="20" cy="20"
                                    style="stroke-dasharray: 113px;
                                        stroke-dashoffset: 0px;
                                        stroke-linecap: round;
                                        stroke-width: 4px;
                                        stroke: #FFFFFF;
                                        fill: none;animation: countdown 28s linear infinite forwards;">
                            </circle>
                        </svg>
                    </div>
                    <div class="game-player opp">
                        <div class="game-info text-end">
                            <div class="game-name" id="gp-opp-name">Eissa</div>
                            <div class="game-score" id="gp-fake">
                                <span id="fake_score_start">0</span><span id="fake_score_show"></span>
                            </div>
                        </div>
                        <div class="game-ava" id="gp-opp">
                            <img src="../../uploads/user/1/ava-eissa.png" alt="Eissa">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="container box-wrapper">
            <div class="swipe">
                <div class="swipe-action">
                    <div class="swipe-action-circle love">
                        <span class="qf-icon-thumbs-up"></span>
                    </div>
                    <div class="swipe-action-circle nope">
                        <span class="qf-icon-thumbs-down"></span>
                    </div>
                </div>

                <div class="answer-toast" id="answerToast" aria-live="polite"></div>

                <div id="swipe-counter" class="swipe-counter">
                    <span id="current" class="count">1</span> of <span id="maxQuestion"></span>
                </div>

                <div class="swipe-cards" id="questionDisplay">
                </div>

                <div class="swipe-status" id="answerOption">
                </div>

                <!-- multiple start -->
                <div class="multiple">
                    <div id="multipleQuestionDisplay">
                    </div>
                    <ul class="multiple-answer" id="multipleAnswerDisplay">
                    </ul>
                </div>
                <!-- multiple end -->

                <!-- <audio id="audio" src="../../theme/audio/eatpellet.ogg" autostart="false" ></audio> -->
                <audio id="audio" src="../../theme/audio/Ticking_Clock.wav" autostart="false" ></audio>
                <audio id="audio_click" src="../../theme/audio/pop.mp3" autostart="false" ></audio>
                <audio id="audio_correct" src="../../theme/audio/answer-correct.wav" autostart="false" ></audio>
                <audio id="audio_wrong" src="../../theme/audio/answer-wrong.wav" autostart="false" ></audio>

                <input type="hidden" name="qno" id="qno" value="0">
                <input type="hidden" name="countdown" id="countdown" value="10">
                <input type="hidden" name="currentQuestion" id="currentQuestion" value="0">

            </div>
        </div>

    </div>


    <script src="../../ext/code.jquery.com/jquery-3.6.1.min.js"></script>
    <script src="../../theme/js/session.js?v=2"></script>
    <script src="../../theme/js/game-demo.js?v=4"></script>
    <script src="../../theme/js/i18n.js?v=2"></script>
    <script src="../../theme/js/bootstrap.bundle.min.js"></script>
    <script src="../../theme/js/hammer.js"></script>
    <script src="../../theme/js/quiz.js"></script>
    <script src="../../theme/js/custom.js?v=login2"></script>
    <script>
    (function () {
        var D = window.QP_DEMO;
        // Opponent picked on the VS screen
        var o = D.opponent();
        document.getElementById('gp-opp-name').textContent = o.name;
        document.getElementById('gp-opp').innerHTML = D.avatarHtml(o);

        // Answer feedback in the header: short, non-blocking, never delays the next card
        var toast = document.getElementById('answerToast'), me = document.getElementById('gp-me'), gain = document.getElementById('gp-gain'), t1;
        function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
        var streak = 0;
        var SPARKS = '<span class="toast-sparks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>';
        document.addEventListener('qp:answer', function (e) {
            var ok = e.detail.ok, t = window.QP_I18N ? QP_I18N.t : function (s) { return s; };
            streak = ok ? streak + 1 : 0;
            var F = window.QP_I18N ? QP_I18N.f : function (x, v) { Object.keys(v).forEach(function (k) { x = x.split('{' + k + '}').join(v[k]); }); return x; };
            var sub = ok ? (streak >= 2 ? F('🔥 {n} in a row · +{p}', { n: streak, p: e.detail.points }) : F('+{p} points', { p: e.detail.points })) : t('Keep going!');
            toast.className = 'answer-toast ' + (ok ? 'ok' : 'bad');
            toast.innerHTML = (ok ? SPARKS : '') +
                '<span class="toast-ico"><span class="fa ' + (ok ? 'fa-check' : 'fa-times') + '"></span></span>' +
                '<span class="toast-text"><b>' + t(ok ? 'Correct!' : 'Wrong') + '</b><small>' + sub + '</small></span>';
            replay(toast, 'show');
            me.classList.remove('flash-ok', 'flash-bad');
            replay(me, ok ? 'flash-ok' : 'flash-bad');
            if (ok) { gain.textContent = '+' + e.detail.points; replay(gain, 'show'); }
            clearTimeout(t1);
            t1 = setTimeout(function () { toast.classList.remove('show'); }, 1300);
        });
        var last = { real: 0, fake: 0 };
        document.addEventListener('qp:score', function (e) {
            if (e.detail.real !== last.real) replay(document.getElementById('gp-real'), 'pop');
            if (e.detail.fake !== last.fake) replay(document.getElementById('gp-fake'), 'pop');
            last = e.detail;
        });
    })();
    </script>
</body>
</html>

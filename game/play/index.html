<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizy Flash</title>
    <link rel="stylesheet" href="../../theme/css/bootstrap.min.css?v=red21">
    <link rel="stylesheet" href="../../theme/fontello/css/quizy-flash.css">
    <link rel="stylesheet" href="../../theme/css/style.css?v=red21">
    <link rel="stylesheet" href="../../ext/cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="../../theme/css/game.css?v=red21">
    <link rel="shortcut icon" type="image/x-icon" href="../../theme/images/favicon-quizpro.ico">
    <link rel="stylesheet" href="../../theme/css/app.css?v=18">
    <script src="../../theme/js/theme.js?v=1"></script>
</head>
<body>
    <div class="content-wrapper">

        <div class="page-header-score game-header">
            <div class="container box-wrapper">
                <div class="game-hud">
                    <div class="game-player me">
                        <div class="game-ava">
                            <img src="../../theme/images/dp.png" data-user-avatar alt="">
                        </div>
                        <div class="game-info">
                            <div class="game-name">You</div>
                            <div class="game-score" id="playScore">0</div>
                        </div>
                        <span class="game-gain" id="playGain"></span>
                    </div>
                    <div class="game-timer" id="countdown" role="timer">
                        <svg viewBox="0 0 40 40" aria-hidden="true">
                            <circle class="game-timer-track" r="18" cx="20" cy="20"></circle>
                            <circle class="game-timer-ring" r="18" cx="20" cy="20"></circle>
                        </svg>
                        <span id="countdown-number">30</span>
                    </div>
                    <div class="game-player opp">
                        <div class="game-info text-end">
                            <div class="game-name" id="oppName"></div>
                            <div class="game-score" id="oppScore">0</div>
                        </div>
                        <div class="game-ava" id="oppAva"></div>
                    </div>
                </div>
                <div class="game-progress" id="playProgress" aria-hidden="true"></div>
            </div>
        </div>

        <div class="container box-wrapper">
            <div class="play-stage">
                <div class="answer-toast" id="answerToast" aria-live="polite"></div>
                <div id="swipe-counter" class="swipe-counter">
                    <span id="current" class="count">1</span> of <span id="maxQuestion">5</span>
                </div>
                <div class="play-card"><p id="playQuestion"></p></div>
                <div class="play-answers" id="playAnswers">
                    <button type="button" class="play-btn is-true" data-answer="true"><span class="play-btn-ico fa fa-check"></span><span>True</span></button>
                    <button type="button" class="play-btn is-false" data-answer="false"><span class="play-btn-ico fa fa-times"></span><span>False</span></button>
                </div>
                <div class="play-opp-answer" id="oppAnswer" aria-live="polite"></div>
            </div>
        </div>

    </div>


    <script src="../../ext/code.jquery.com/jquery-3.6.1.min.js"></script>
    <script src="../../theme/js/session.js?v=4"></script>
    <script src="../../theme/js/questions.js?v=1"></script>
    <script src="../../theme/js/game-demo.js?v=8"></script>
    <script src="../../theme/js/i18n.js?v=9"></script>
    <script src="../../theme/js/bootstrap.bundle.min.js"></script>
    <script src="../../theme/js/play.js?v=5"></script>
</body>
</html>

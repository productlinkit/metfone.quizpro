            </div>
        </div>

        <div class="container box-wrapper">
            <div class="contact-hero">

                <p class="contact-hero-sub">Our team is happy to help. Choose how you'd like to reach us.</p>
            </div>

            <div class="card-simple-outer contact-list">
                <a href="http://wa.me/6289655913961" target="_blank" rel="noopener" class="contact-opt">

                    <span class="contact-opt-text"><b>WhatsApp</b><small>Chat with us · usually replies in minutes</small></span>

                </a>
                <a href="https://mail.google.com/mail/u/0/?fs=1&tf=cm&to=customer.service@linkit360.com&su=&body=" target="_blank" rel="noopener" class="contact-opt">

                    <span class="contact-opt-text"><b>Email</b><small>customer.service@linkit360.com</small></span>
                    <span class="contact-opt-go qf-icon-arrow-right"></span>
                </a>
            </div>

            <div class="contact-info"><span class="fa fa-clock-o"></span> Support hours: Mon – Sat, 08:00 – 20:00</div>
            <a href="../rule/index.html" class="contact-faq"><span class="fa fa-book"></span> Read Rules and Policies</a>

    </div>

                </div>
